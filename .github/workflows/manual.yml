# Build doc/Manual.tex and publish the PDF to GitHub Pages:
#   https://deep-sane.github.io/u4lib/Manual.pdf
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Manual

on:
  push:
    branches: [main]
    paths: ['doc/**', '.github/workflows/manual.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: doc
          root_file: Manual.tex
      - name: Assemble site
        run: |
          mkdir site
          cp doc/Manual.pdf site/Manual.pdf
          echo '<meta http-equiv="refresh" content="0; url=Manual.pdf">' > site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}Manual.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
